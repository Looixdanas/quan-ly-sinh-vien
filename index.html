<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý sinh viên</title>
<meta name="theme-color" content="#0f6cbd"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="QLSV">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2433;--mu:#6b7488;--bd:#e3e6ee;--pr:#4f46e5;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--tr:#e9ebf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3042;--pr:#818cf8;--tr:#2b3042}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#98a0b5;--bd:#2b3042;--pr:#818cf8;--tr:#2b3042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 16px 0;max-width:1000px;margin:auto}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--tr);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr);border-radius:9px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .g{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
.add input{flex:1 1 140px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.del{background:none;border:0;color:var(--er);cursor:pointer;font-size:18px;padding:4px 8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tr)}
.late{color:var(--er)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;font-size:14px}
td select{width:100%}td input{width:64px;margin-top:4px}
.s-done{border-color:var(--ok)}.s-doing{border-color:var(--wa)}
.empty{color:var(--mu);text-align:center;padding:18px}
</style>
</head>
<body>
<style>.alt{background:var(--tr);color:var(--tx)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.login{max-width:380px;margin:30px auto}.login input,textarea{width:100%;margin-bottom:8px}
#nav{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85%;background:var(--card);z-index:20;flex-direction:column;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;transform:translateX(-105%);transition:transform .2s;border-right:1px solid var(--bd)}
#nav.open{transform:none}#nav button{border-radius:10px;text-align:left;width:100%;border-color:transparent;flex:none}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}#ov.open{display:block}
.mh{display:flex;gap:12px;align-items:center;padding:8px 4px 16px;margin-bottom:8px;border-bottom:1px solid var(--bd)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pr);color:#fff;font-weight:600;object-fit:cover;flex:none}
.ro td select,.ro td input,.ro .add input,.ro .btn:not([data-ok]),.ro .del{pointer-events:none;opacity:.5}</style>
<header><div class="top"><div style="display:flex;align-items:center;gap:10px"><button id="hb" class="btn alt" onclick="menu(true)" aria-label="Menu" style="font-size:20px;line-height:1">☰</button><h1 id="ttl" style="margin:0">🎓 Quản lý sinh viên</h1></div><div id="who"></div></div>
</header><nav id="nav"></nav><div id="ov" onclick="menu(false)"></div><input type="file" id="af" accept="image/*" hidden onchange="setAv(this)">
<main id="main"></main>
<script>
const KEY="qlsv_v1";
const seed={tab:"home",
students:[{id:1,name:"Nguyễn Văn An",code:"SV001",cls:"CNTT1"},{id:2,name:"Trần Thị Bình",code:"SV002",cls:"CNTT1"},{id:3,name:"Lê Minh Châu",code:"SV003",cls:"CNTT2"}],
assignments:[{id:1,title:"Bài tập 1: Mảng và vòng lặp",due:"2026-10-15",desc:"Làm 5 bài cơ bản"},{id:2,title:"Đồ án giữa kỳ",due:"2026-11-05",desc:"Ứng dụng quản lý đơn giản"}],
sub:{"1_1":{st:"done",sc:9},"1_2":{st:"doing",sc:""},"2_1":{st:"done",sc:8}},nid:10};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.students)S=seed;
S.daily=S.daily||[];S.reports=S.reports||{};S.ps=S.ps||{};S.auditBase=S.auditBase||"";
if(!S.projects)S.projects=[{id:5,title:"Đồ án: Website quản lý",due:"2026-12-20",desc:"Hoàn thiện theo từng giai đoạn",tasks:[{id:6,title:"Phân tích yêu cầu",due:"2026-10-25"},{id:7,title:"Thiết kế giao diện",due:"2026-11-10"},{id:8,title:"Lập trình chức năng",due:"2026-12-01"}]}];
function save(){if(!DB)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TG=[["home","Tổng quan"],["sv","Sinh viên"],["bt","Giao bài tập"],["td","Theo dõi tiến độ"],["bc","Báo cáo ngày"],["da","Bài tập lớn"],["pf","Hồ sơ"]];
const TH=[["bai","Bài tập của tôi"],["ngay","Việc hằng ngày"],["da","Bài tập lớn"],["tt","Tiến độ"],["pf","Hồ sơ"]];
const ICO={home:"🏠",sv:"👥",bt:"📝",td:"📊",bai:"📝",tt:"📈",pf:"👤",ngay:"✅",da:"📦",bc:"🗓️",tk:"🔑",dk:"🆕",nk:"🧾",tb:"📢"};
const TP="gv123";let LR="gv";
const ST={todo:"Chưa làm",doing:"Đang làm",done:"Hoàn thành"};
const g=(a,s)=>({...(S.sub[a+"_"+s]||{st:"todo"}),sc:(S.gr||{})[a+"_"+s]??""});
const pct=(n,d)=>d?Math.round(n/d*100):0;
function stuProg(s){const A=S.assignments;const d=A.filter(a=>g(a.id,s.id).st==="done").length;
const sc=A.map(a=>g(a.id,s.id).sc).filter(x=>x!==""&&!isNaN(x)).map(Number);
return{d,p:pct(d,A.length),avg:sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1):"–"}}
function bar(p){return `<div class="bar"><i style="width:${p}%"></i></div>`}
function go(t){S.tab=t;save();menu(false);render()}
function render(){
const u=S.user;applyMode();
if(!MODE){$("#hb").style.display="none";$("#nav").innerHTML="";$("#who").innerHTML="";$("#main").innerHTML=chooseV();return}
$("#hb").style.display=u?"":"none";
if(!u){$("#nav").innerHTML="";$("#who").innerHTML="";$("#main").innerHTML=loginV();return}
if((MODE==="hs")!==(u.role==="hs")){const hs=u.role==="hs";setMode(hs?"hs":"ql");alert(hs?"Đây là tài khoản học sinh. Bạn sẽ được chuyển về cổng học sinh.":"Đây là tài khoản quản lý. Bạn sẽ được chuyển về cổng quản lý.");return}
const me=S.students.find(s=>s.id===u.id);
if(u.role==="hs"&&!me){S.user=null;save();return render()}
const T=tabsFor();
if(!T.some(t=>t[0]===S.tab))S.tab=T[0][0];
const k=ak(),nm=u.role!=="hs"?(S.tname||"Giáo viên"):me.name;
$("#who").innerHTML=`<span style="display:flex;align-items:center;gap:8px">${avt(k,34,nm)}<button class="btn alt" onclick="logout()" style="padding:5px 10px">Đăng xuất</button></span>`;
$("#nav").innerHTML=`<div class="mh">${avt(k,52,nm)}<div><b>${esc(nm)}</b><div class="mu">${(ROLES[u.role]||ROLES.gv).n}</div></div></div>`
+T.map(([t,v])=>`<button class="${S.tab===t?"on":""}" onclick="go('${t}')">${ICO[t]} ${v}${t==="dk"&&regL().length?` <span class="tag" style="background:var(--wa);color:#fff">${regL().length}</span>`:""}</button>`).join("")
+`<button onclick="$('#af').click()">📷 Ảnh đại diện</button><button onclick="inst()">📲 Cài app</button>${u.role!=="hs"?`<button onclick="setMode('')">🔀 Đổi cổng</button>`:""}<button onclick="logout()">🚪 Đăng xuất</button><div class="mu" style="padding:10px 12px;font-size:12px">Phiên bản 10 · giao diện văn phòng</div>`;
{const all=S.students;if(u.role!=="hs")S.students=vis();try{$("#main").innerHTML=pgT(T)+({home,sv,bt,td,bai,tt,pf,ngay,da,bc,tk,nk,tb,dk})[S.tab]()}finally{S.students=all}}$("#main").classList.toggle("ro",u.role!=="hs"&&!can("grade")&&!can("assign"))}
const ak=()=>S.user.role!=="hs"?"gv":S.user.id;
function avt(k,z,nm){const im=S.av&&S.av[k];const st=`width:${z}px;height:${z}px;font-size:${z/2.4}px`;
return im?`<img class="av" style="${st}" src="${im}" alt="">`:`<span class="av" style="${st}">${esc((nm||"?").trim().split(" ").pop().charAt(0).toUpperCase())}</span>`}
function menu(o){$("#nav").classList.toggle("open",o);$("#ov").classList.toggle("open",o)}
function setAv(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d");
const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);
S.av=S.av||{};S.av[ak()]=c.toDataURL("image/jpeg",.8);save();inp.value="";menu(false);render()};im.src=r.result};r.readAsDataURL(f)}
function pf(){const t=S.user.role!=="hs",s=t?null:S.students.find(x=>x.id===S.user.id),nm=t?(S.tname||"Giáo viên"):s.name;
return `<div class="card" style="text-align:center">${avt(ak(),96,nm)}<div><button class="btn alt" style="margin-top:10px" onclick="$('#af').click()">Đổi ảnh đại diện</button></div></div>
<div class="card"><h2>Hồ sơ</h2><label class="mu">Họ tên</label><input id="pn" value="${esc(nm)}" style="width:100%;margin-bottom:8px">
${t?`<label class="mu">Môn giảng dạy</label><input id="pe" value="${esc(S.subj||"")}" style="width:100%;margin-bottom:8px">`:`<div class="mu" style="margin-bottom:10px">Mã SV: ${esc(s.code)} · Lớp: ${esc(s.cls)}</div>`}
<button class="btn" onclick="savePf()">Lưu</button></div>`}
function savePf(){const n=$("#pn").value.trim();if(!n)return;if(S.user.role!=="hs"){const o=S.tname||"",os=S.subj||"",ns=$("#pe").value.trim();if(o!==n||os!==ns)log("Cập nhật hồ sơ cá nhân","Họ tên: "+(o||"(trống)")+" → "+n+(os!==ns?" · Môn giảng dạy: "+(os||"(trống)")+" → "+(ns||"(trống)"):""),"tk");S.tname=n;S.subj=ns}else S.students.find(x=>x.id===S.user.id).name=n;save();render()}
function logout(){menu(false);if(DB)NOAUTO=true;if(S.user&&S.user.role!=="hs")log("Đăng xuất","","ht");S.user=null;save();render()}
function bai(){return rem()+bai0()}
function bai0(){const s=S.students.find(x=>x.id===S.user.id),A=S.assignments;
return `<div class="card"><h2>Nộp bài</h2>${A.length?`<div class="add"><select id="sa">${A.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join("")}</select><input id="snm" placeholder="Tên bài nộp"></div><div class="add"><input id="stx" placeholder="Nội dung / link bài làm"><select id="sst"><option value="doing">Đang làm</option><option value="done">Hoàn thành</option></select><button class="btn" onclick="submitB()">Nộp</button></div>`:'<div class="empty">Chưa có bài tập</div>'}</div>
<div class="card"><h2>Danh sách bài tập</h2>${A.map(a=>{const c=g(a.id,s.id);return `<div class="row"><div class="g"><b>${esc(a.title)}</b><div class="mu">Hạn: ${esc(a.due||"—")} · ${esc(a.desc)}</div>${c.nm||c.txt?`<div class="mu">📎 ${esc(c.nm)} ${esc(c.txt)}</div>`:""}</div><div><span class="tag">${ST[c.st]}</span><div class="mu">Điểm: ${c.sc===""?"chưa chấm":esc(c.sc)}</div></div></div>`}).join("")}</div>`}
function tt(){const s=S.students.find(x=>x.id===S.user.id),p=stuProg(s);
return `<div class="grid"><div class="stat"><b>${p.p}%</b><span>Hoàn thành</span></div><div class="stat"><b>${p.avg}</b><span>Điểm TB</span></div><div class="stat"><b>${p.d}/${S.assignments.length}</b><span>Bài đã xong</span></div></div><div class="card"><h2>Chi tiết</h2>${bar(p.p)}${S.assignments.map(a=>`<div class="row"><span>${esc(a.title)}</span><span class="tag">${ST[g(a.id,s.id).st]}</span></div>`).join("")}</div>`}
function submitB(){const a=$("#sa").value,k=a+"_"+S.user.id;S.sub[k]={...(S.sub[k]||{}),st:$("#sst").value,nm:$("#snm").value.trim(),txt:$("#stx").value.trim(),at:ymd(new Date())};save();render()}
function home(){return regNote()+homeX()+home0()}
function home0(){
const A=S.assignments,St=S.students,tot=A.length*St.length;
const done=A.reduce((n,a)=>n+St.filter(s=>g(a.id,s.id).st==="done").length,0);
const today=ymd(new Date());
const up=[...A].sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);
return `<div class="grid"><div class="stat"><b>${St.length}</b><span>Sinh viên</span></div>
<div class="stat"><b>${A.length}</b><span>Bài tập</span></div>
<div class="stat"><b>${pct(done,tot)}%</b><span>Hoàn thành chung</span></div></div>
<div class="card"><h2>Tiến độ từng sinh viên</h2>${St.length?St.map(s=>{const p=stuProg(s);return `<div class="row"><div class="g"><b>${esc(s.name)}</b> <span class="mu">${esc(s.code)}</span>${bar(p.p)}</div><div class="mu">${p.p}% · ĐTB ${p.avg}</div></div>`}).join(""):'<div class="empty">Chưa có sinh viên</div>'}</div>
<div class="card"><h2>Hạn nộp sắp tới</h2>${up.length?up.map(a=>{const dn=St.filter(s=>g(a.id,s.id).st==="done").length;return `<div class="row"><div class="g"><b>${esc(a.title)}</b><div class="mu ${a.due<today?"late":""}">Hạn: ${esc(a.due)}${a.due<today?" (quá hạn)":""}</div></div><span class="tag">${dn}/${St.length} nộp</span></div>`}).join(""):'<div class="empty">Chưa có bài tập</div>'}</div>`}
function sv0(){return `<div class="card"><h2>Thêm sinh viên</h2><div class="add">
<input id="n" placeholder="Họ tên"><input id="c" placeholder="Mã SV"><input id="l" placeholder="Lớp"><input id="se" type="email" placeholder="Gmail (tùy chọn)"><button class="btn" onclick="addS()">Thêm</button></div>
${S.students.length?S.students.map(s=>`<div class="row"><div class="g"><b>${esc(s.name)}</b><div class="mu">${esc(s.code)} · ${esc(s.cls)}${s.em?" · "+esc(s.em):""}</div></div>${linkedTo(s.id)?`<button class="del" style="color:var(--mu)" title="Gỡ liên kết tài khoản" onclick="unl(${s.id})">🔗</button>`:""}<button class="del" onclick="delS(${s.id})" aria-label="Xóa">✕</button></div>`).join(""):'<div class="empty">Chưa có sinh viên</div>'}</div>`}
function sv(){const all=S.students,q=Q.sv.trim().toLowerCase();
S.students=q?all.filter(s=>(s.name+" "+s.code+" "+s.cls).toLowerCase().includes(q)):all;
let o;try{o=sv0()}finally{S.students=all}
return o.replace('onclick="addS()">Thêm</button></div>','onclick="addS()">Thêm</button></div><input id="qs" placeholder="🔍 Tìm theo tên, mã, lớp" value="'+esc(Q.sv)+'" oninput="Q.sv=this.value;renderKeep()" style="width:100%;margin-bottom:8px">')}
function bt(){return `<div class="card"><h2>Giao bài tập mới</h2><div class="add">
<input id="t" placeholder="Tên bài tập"><input id="d" type="date"><input id="x" placeholder="Mô tả"><button class="btn" onclick="addA()">Thêm</button></div>
${S.assignments.length?S.assignments.map(a=>`<div class="row"><div class="g"><b>${esc(a.title)}</b><div class="mu">Hạn: ${esc(a.due||"—")} · ${esc(a.desc)}</div></div><button class="del" onclick="delA(${a.id})" aria-label="Xóa">✕</button></div>`).join(""):'<div class="empty">Chưa có bài tập</div>'}</div>`}
function td(){const A=S.assignments,St=S.students;
if(!A.length||!St.length)return '<div class="card empty">Cần có ít nhất 1 sinh viên và 1 bài tập</div>';
return `<div class="card sc"><h2>Bảng theo dõi tiến độ</h2><table><tr><th>Sinh viên</th>${A.map(a=>`<th>${esc(a.title)}</th>`).join("")}<th>Tổng</th></tr>
${St.map(s=>{const p=stuProg(s);return `<tr><td><b>${esc(s.name)}</b><div class="mu">${esc(s.code)}</div></td>${A.map(a=>{const c=g(a.id,s.id);return `<td><select class="s-${c.st}" onchange="setSub(${a.id},${s.id},'st',this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${c.st===k?"selected":""}>${v}</option>`).join("")}</select><input type="number" min="0" max="10" step="0.5" placeholder="Điểm" value="${esc(c.sc)}" onchange="setSub(${a.id},${s.id},'sc',this.value)">${c.nm||c.txt?`<div class="mu">📎 ${esc(c.nm)} ${esc(c.txt)}</div>`:""}</td>`}).join("")}<td><b>${p.p}%</b><div class="mu">ĐTB ${p.avg}</div></td></tr>`}).join("")}</table></div>`}
function delS(id){const s0=S.students.find(x=>x.id===id);if(!s0)return;if(!confirm("Xóa sinh viên này? Bài nộp, điểm, báo cáo và liên kết tài khoản của em cũng bị xóa."))return;
const cn={sub:Object.keys(S.sub).filter(k=>k.endsWith("_"+id)).length,gr:Object.keys(S.gr).filter(k=>k.endsWith("_"+id)&&k[0]!=="f").length,rep:Object.keys(S.reports).filter(k=>k.startsWith(id+"_")).length,dl:S.daily.filter(x=>x.sid===id).length,acc:DB?Object.keys(ACC).filter(u=>ACC[u].role==="hs"&&ACC[u].id===id).length:0};
log("Xóa sinh viên: "+s0.name,"Mã "+(s0.code||"chưa có")+" · Lớp "+(s0.cls||"—")+". Đồng thời xóa: "+cn.sub+" bài làm, "+cn.gr+" điểm, "+cn.rep+" báo cáo ngày, "+cn.dl+" việc hằng ngày; gỡ "+cn.acc+" liên kết tài khoản.","sv");
S.students=S.students.filter(s=>s.id!==id);
for(const o of [S.sub,S.ps,S.gm,S.gr])Object.keys(o).forEach(k=>{if(k.endsWith("_"+id)||k.startsWith("f_"+id+"_"))delete o[k]});
Object.keys(S.reports).forEach(k=>{if(k.startsWith(id+"_"))delete S.reports[k]});
S.daily=S.daily.filter(x=>x.sid!==id);
if(DB){const us=Object.keys(ACC).filter(u=>ACC[u].role==="hs"&&ACC[u].id===id);us.forEach(u=>{delete ACC[u];DB.doc("work/"+u).delete().catch(()=>{})});if(us.length)aref.set({map:ACC}).catch(()=>{})}
save();render()}

return `<div class="card login"><h2>Đăng ký học sinh</h2><p class="mu">Gửi yêu cầu, giáo viên sẽ duyệt.</p><input type="hidden" id="rt" value="hs"><input id="rn" placeholder="Họ tên"><input id="re" type="email" placeholder="Gmail của bạn"><input id="rc" placeholder="Mã sinh viên (nếu có)"><input id="rl" placeholder="Lớp" list="cl">${clList()}<button class="btn" onclick="sendReg()">Gửi đăng ký</button></div>`}
async function activate(){const v=$("#u").value.trim();if(!v)return;const h=await hsh(v),iv=(S.inv||[]).find(i=>i.h===h);
if(!iv||iv.used||(iv.exp&&iv.exp<td0()))return alert("Mã không hợp lệ, đã dùng hoặc hết hạn");
iv.used=UID;S.user={role:iv.role,cls:iv.cls||[],lb:iv.lb};log("Kích hoạt tài khoản quản lý: "+(iv.lb||(ROLES[iv.role]||ROLES.gv).n),"Vai trò: "+(ROLES[iv.role]||ROLES.gv).n+" · Lớp phụ trách: "+((iv.cls||[]).join(", ")||"không có"),"tk");S.tab="";setAcc();save();render()}
function tkA(){return `<div class="card"><h2>Thêm tài khoản quản lý</h2><div class="add"><input id="il" placeholder="Họ tên"><select id="ir">${Object.entries(ROLES).filter(([k])=>k!=="hs").map(([k,v])=>`<option value="${k}" ${k==="gv"?"selected":""}>${v.n}</option>`).join("")}</select><input id="ic" placeholder="Lớp phụ trách (vd: CNTT1, CNTT2)"><button class="btn" onclick="mkInv()">Tạo mã kích hoạt</button></div><p class="mu">Gửi riêng mã cho người đó. Họ mở cổng quản lý (#ql) và nhập mã một lần là có tài khoản. Mã dùng 1 lần, hạn 7 ngày.</p>${(S.inv||[]).map((i,x)=>`<div class="row"><div class="g">${esc(i.lb||"—")} · ${(ROLES[i.role]||ROLES.gv).n}<div class="mu">Lớp: ${esc((i.cls||[]).join(", ")||"không có")} · hạn ${esc(i.exp)} · ${i.used?"đã kích hoạt":"chờ kích hoạt"}</div></div><button class="del" onclick="delInv(${x})">✕</button></div>`).join("")}</div>`}
const SH=["students","assignments","projects","gm","nid","inv","audit","auditBase","notices","gr"];
let WS=false,MIG=false,lastW="",RQ=0,EA=0,RT=0,PD=0,BUSY=false;
addEventListener("pointerdown",()=>{PD=Date.now()},true);
const rr=()=>{clearTimeout(RT);cancelAnimationFrame(RQ);const w=500-(Date.now()-PD);if(w>0)RT=setTimeout(rr,w);else RQ=requestAnimationFrame(renderKeep)};
const er=()=>toast("Không lưu được: bạn chưa có quyền ghi phần dữ liệu này.");
const uidOf=sid=>Object.keys(ACC).find(u=>ACC[u].role==="hs"&&ACC[u].id===sid);
function wdoc(sid){const e=(o,f)=>Object.fromEntries(Object.entries(o).filter(([k])=>f(k)));
return {sid,sub:e(S.sub,k=>k.endsWith("_"+sid)),ps:e(S.ps,k=>k.endsWith("_"+sid)),reports:e(S.reports,k=>k.startsWith(sid+"_")),daily:S.daily.filter(x=>x.sid===sid)}}
function fold(w){const sid=w.sid;if(sid==null)return;
S.daily=S.daily.filter(x=>x.sid!==sid).concat(w.daily||[]);
Object.assign(S.sub,w.sub||{});Object.assign(S.ps,w.ps||{});Object.assign(S.reports,w.reports||{})}
function wchg(){const g2=JSON.stringify([S.sub,S.ps,S.daily,S.reports]);if(g2===lastW)return;lastW=g2;rr()}
function wsub(){if(WS||!S.user||!DB)return;WS=true;
if(S.user.role==="hs")DB.doc("work/"+UID).onSnapshot(x=>{if(x.exists){fold(x.data());wchg()}},()=>{});
else DB.collection("work").onSnapshot(q=>{q.docs.forEach(x=>fold(x.data()));wchg()},()=>{})}
function push(){if(!DB||!ready)return;clearTimeout(wt);wt=setTimeout(()=>{const u=S.user;if(!u)return;
if(u.role==="hs"){DB.doc("work/"+UID).set(wdoc(u.id)).catch(er);return}
const d={};SH.forEach(k=>d[k]=S[k]);last=shJ();sref.set(d).catch(er);
DIRTY.forEach(sid=>{const uid=uidOf(sid);if(uid)DB.doc("work/"+uid).set(wdoc(sid)).catch(er)});DIRTY.clear()},400)}
function migrate(x){Object.entries(x.sub||{}).forEach(([k,v])=>{if(v&&v.sc!==undefined&&v.sc!=="")S.gr[k]=v.sc});
Object.entries(x.reports||{}).forEach(([k,v])=>{if(v&&v.fb)S.gr["f_"+k]=v.fb});
S.sub=x.sub||S.sub;S.ps=x.ps||S.ps;S.daily=x.daily||S.daily;S.reports=x.reports||S.reports;
setTimeout(()=>{Object.keys(ACC).forEach(u=>{if(ACC[u].role==="hs")DB.doc("work/"+u).set(wdoc(ACC[u].id)).catch(er)});push()},1500)}
async function initDB(){try{
if(!window.claude)return;
const u=await claude.use("user"),d=await claude.use("db");if(!u||!d)return;
UID=await u.id();ISGV=await u.isOwner();DB=d;S.user=null;try{localStorage.removeItem(KEY)}catch(e){}
sref=d.doc("app/state");aref=d.doc("app/accounts");
aref.onSnapshot(x=>{ACC=(x.exists&&x.data().map)||{};autoLogin()},()=>{});
sref.onSnapshot(x=>{
if(!x.exists){if(ISGV&&!ready){ready=true;push();autoLogin()}return}
const v=x.data(),b=shJ();ready=true;
SH.forEach(k=>{if(v[k]!==undefined)S[k]=v[k]});
if(v.sub!==undefined&&ISGV&&!MIG){MIG=true;migrate(v)}
if(shJ()===b){autoLogin();return}
last=shJ();autoLogin();rr()},()=>{});
rr()}catch(e){}}
try{new MutationObserver(()=>document.querySelectorAll("#main input:not([maxlength]),#main textarea:not([maxlength])").forEach(e=>e.maxLength=e.tagName==="TEXTAREA"?2000:300)).observe(document.getElementById("main"),{childList:true,subtree:true})}catch(e){}
function toast(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90%;font-size:14px";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",4500)}
async function okReg(uid){
if(!DB){const r=REG.find(x=>x.uid===uid);if(!r)return;let st=r.code&&S.students.find(x=>x.code.toLowerCase()===r.code.toLowerCase());
const ex=!!st;if(!st){const id=S.nid++;st={id,name:r.name,code:r.code||("SV"+String(id).padStart(3,"0")),cls:r.cls};S.students.push(st)}
st.em=mask(r.em);REG=REG.filter(x=>x.uid!==uid);lsReg();log("Duyệt đăng ký: "+r.name,regD(r,ex,st),"dk");save();toast("Đã duyệt: "+r.name+" · Mã đăng nhập: "+st.code);return rr()}
if(BUSY)return;const r=REG.find(x=>x.uid===uid);if(!r)return toast("Không tìm thấy đăng ký, hãy tải lại trang");
BUSY=true;toast("Đang duyệt...");const bk=JSON.stringify([S.students,ACC,S.nid]);
try{
if(r.type==="gv"){if(!can("accounts"))throw new Error("chỉ quản trị mới duyệt được giáo viên");
const role=(document.getElementById("rr"+uid)||{}).value||"gv";ACC[uid]={role,cls:(r.cls||"").split(",").map(x=>x.trim()).filter(Boolean),lb:r.name}}
else{let st=r.code&&S.students.find(x=>x.code.toLowerCase()===r.code.toLowerCase()&&!linkedTo(x.id));
var ex=!!st;if(!st){st={id:S.nid++,name:r.name,code:r.code||"",cls:r.cls};S.students.push(st)}
st.em=mask(r.em);ACC[uid]={role:"hs",id:st.id};var stD=st}
await aref.set({map:ACC});await DB.doc("reg/"+uid).delete();
log("Duyệt đăng ký: "+r.name,regD(r,ex,stD),"dk");REG=REG.filter(x=>x.uid!==uid);save();toast("Đã duyệt: "+r.name)}
catch(e){const b=JSON.parse(bk);S.students=b[0];ACC=b[1];S.nid=b[2];toast("Duyệt thất bại: "+((e&&e.message)||e))}
finally{BUSY=false;rr()}}
async function noReg(uid){if(!DB){const r=REG.find(x=>x.uid===uid);REG=REG.filter(x=>x.uid!==uid);lsReg();if(r)log("Từ chối đăng ký: "+r.name,regD(r),"dk");save();toast("Đã từ chối đăng ký");return rr()}
const r=REG.find(x=>x.uid===uid);try{await DB.doc("reg/"+uid).delete();REG=REG.filter(x=>x.uid!==uid);if(r)log("Từ chối đăng ký: "+r.name,regD(r),"dk");save();toast("Đã từ chối đăng ký")}catch(e){toast("Thất bại: "+((e&&e.message)||e))}rr()}
function aprv(id){const p=S.projects.find(x=>x.id===id);if(!p)return;p.ap="ok";log("Duyệt bài tập lớn: "+p.title,"Hạn: "+(p.due||"không có"),"da");save();toast("Đã duyệt bài tập lớn");rr()}
document.addEventListener("keydown",e=>{
if(e.key!=="Enter"||e.isComposing||e.keyCode===229||e.shiftKey)return;
const t=e.target;if(!t||t.tagName!=="INPUT"||["checkbox","hidden","file","button","radio"].includes(t.type))return;
const c=t.closest(".add,.login"),b=c&&[...c.querySelectorAll("button.btn")].filter(x=>!x.classList.contains("alt")&&!x.disabled).pop();
e.preventDefault();if(b)b.click();else t.blur()});
const cntR=sid=>Object.keys(S.reports).filter(k=>k.startsWith(sid+"_")).length;
function homeX(){const St=S.students,days=[...Array(7)].map((_,i)=>ymd(new Date(Date.now()-(6-i)*864e5)));
const cnt=days.map(d=>St.filter(s=>S.reports[s.id+"_"+d]).length),mx=Math.max(1,St.length);
const rk=St.map(s=>({s,n:cntR(s.id),st:streak(s.id)})).sort((a,b)=>b.n-a.n||b.st-a.st);
const miss=St.filter(s=>!S.reports[s.id+"_"+td0()]);
return `<div class="card"><h2>📈 Báo cáo 7 ngày qua</h2><div style="display:flex;align-items:flex-end;gap:6px;height:100px">${cnt.map((c,i)=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(c/mx*60)}px;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px"></div><div class="mu" style="font-size:11px">${days[i].slice(5)}</div><div class="mu" style="font-size:11px">${c}</div></div>`).join("")}</div></div>
<div class="card"><h2>🏆 Xếp hạng chuyên cần</h2>${rk.map((r,i)=>`<div class="row"><span class="g">${["🥇","🥈","🥉"][i]||(i+1)+"."} ${esc(r.s.name)}</span><span class="mu">${r.n} báo cáo · 🔥${r.st}</span></div>`).join("")||'<div class="empty">Chưa có dữ liệu</div>'}</div>
${miss.length?`<div class="card" style="border-color:var(--wa)"><h2>🔔 Chưa báo cáo hôm nay</h2>${miss.map(s=>esc(s.name)).join(", ")}</div>`:""}
<div class="add"><button class="btn alt" onclick="copyX()">📋 Sao chép bảng tiến độ (dán vào Excel)</button></div>`}
function copyX(){const A=S.assignments,rows=[["Sinh viên","Mã",...A.map(a=>a.title),...S.projects.map(p=>"ĐA: "+p.title),"% bài tập","Số báo cáo"]];
vis().forEach(s=>rows.push([s.name,s.code,...A.map(a=>{const c=g(a.id,s.id);return ST[c.st]+(c.sc!==""?" ("+c.sc+")":"")}),...S.projects.map(p=>pgP(p,s.id)+"%"),stuProg(s).p+"%",cntR(s.id)]));
const t=rows.map(r=>r.join("\t")).join("\n");
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("Đã sao chép! Dán vào Excel hoặc Google Sheets."),()=>prompt("Sao chép bảng này:",t))}
function rem(){const id=S.user.id,t=td0(),m=[],soon=ymd(new Date(Date.now()+2*864e5));
if(!S.reports[id+"_"+t])m.push("📝 Bạn chưa báo cáo hôm nay");
const chk=(ti,d,done)=>{if(!done&&d){if(d<t)m.push("⚠️ Quá hạn: "+ti);else if(d<=soon)m.push("⏰ Sắp đến hạn: "+ti)}};
S.assignments.forEach(a=>chk(a.title,a.due,g(a.id,id).st==="done"));
S.projects.forEach(p=>p.tasks.forEach(k=>chk(k.title,k.due,g2(k.id,id).st==="done")));
return m.length?`<div class="card" style="border-color:var(--wa)"><h2>🔔 Nhắc việc</h2>${m.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`:""}
function bcA(){return `<div class="card"><h2>Giao việc cho cả lớp (${esc(DD)})</h2><div class="add"><input id="ct" placeholder="Công việc..."><button class="btn" onclick="giao()">Giao</button></div></div>`}
function giao(){const t=$("#ct").value.trim();if(!t)return;log("Giao việc cho cả lớp: "+trunc(t,60),"Ngày "+DD+" · Giao cho "+vis().length+" sinh viên (lớp: "+([...new Set(vis().map(s=>s.cls))].filter(Boolean).join(", ")||"—")+")","bc");vis().forEach(s=>{DIRTY.add(s.id);S.daily.push({id:Date.now()+Math.floor(Math.random()*999),sid:s.id,date:DD,text:t,done:false,gv:1})});save();render()}
const gmOf=(p,s)=>S.gm[p.id+"_"+s]||{g:0,lead:false};
function grpAvg(p,gid){const m=S.students.filter(s=>gmOf(p,s.id).g===gid);return m.length?Math.round(m.reduce((a,s)=>a+pgP(p,s.id),0)/m.length):0}
function grpSel(p,s){const c=gmOf(p,s),G=p.groups||[];if(!G.length)return "";
return `<select onchange="setG(${p.id},${s},this.value)"><option value="0">Chưa có nhóm</option>${G.map(x=>`<option value="${x.id}" ${c.g===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>${c.g?`<button class="del" style="color:var(--wa)" title="Nhóm trưởng" onclick="setL(${p.id},${s})">${c.lead?"⭐":"☆"}</button>`:""}`}
function setG(p,s,v){const pr=S.projects.find(x=>x.id===p),G=pr.groups||[],nm=id=>id?(G.find(x=>x.id===id)||{name:"?"}).name:"chưa có nhóm";log("Chia nhóm","Bài tập lớn: "+pr.title+" · Sinh viên: "+sName(s)+" · Nhóm: "+nm(gmOf(pr,s).g)+" → "+nm(+v),"da");S.gm[p+"_"+s]={g:+v,lead:false};save();render()}
function setL(p,s){const c=S.gm[p+"_"+s];c.lead=!c.lead;log(c.lead?"Chọn nhóm trưởng":"Bỏ nhóm trưởng","Bài tập lớn: "+(S.projects.find(x=>x.id===p)||{}).title+" · Sinh viên: "+sName(s),"da");save();render()}
function addG(pid){const n=$("#gn"+pid).value.trim();if(!n)return;const p=S.projects.find(x=>x.id===pid);(p.groups=p.groups||[]).push({id:S.nid++,name:n});log("Tạo nhóm: "+n,"Bài tập lớn: "+p.title,"da");save();render()}
function grpInfo(p,id){const c=gmOf(p,id),G=(p.groups||[]).find(x=>x.id===c.g);if(!c.g||!G)return "";
const ms=S.students.filter(s=>gmOf(p,s.id).g===c.g);
return `<div class="tag" style="display:inline-block;margin:6px 0">👥 Nhóm ${esc(G.name)}: ${ms.map(s=>esc(s.name)+(gmOf(p,s.id).lead?" ⭐":"")+" ("+pgP(p,s.id)+"%)").join(", ")}</div>`}
render();setTimeout(seal,800);
</script>
